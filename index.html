<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#185fa5">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="MathEditor">
  <title>MathEditor</title>
  <link rel="icon" href="/favicon.ico" sizes="48x48">
  <link rel="icon" href="/favicon.svg" sizes="any" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@latest/tabler-icons.min.css">
  <script>
    (function () {
      var font = localStorage.getItem('mj-font') || '';
      window.MathJax = {
        loader: { load: ['input/tex', 'input/asciimath', 'output/svg'] },
        tex: {
          inlineMath:  [['$', '$']],
          displayMath: [['$$', '$$']],
        },
        svg: {
          fontCache: 'local',
          scale: 1.1,
          // MathJax 4 parte la matemática inline en varios <svg> por los puntos
          // donde el renglón podría romper ('x + y = z' sale en tres trozos).
          // Una ecuación incrustada como imagen no puede reflowear, y quedarse
          // con el primer trozo perdería el resto sin avisar.
          linebreaks: { inline: false },
        },
        startup: { typeset: false },
      };
      if (font) window.MathJax.output = { font: font };
    })();
  </script>
  <script src="https://cdn.jsdelivr.net/npm/mathjax@4.1.2/startup.js" id="MathJax-script" async></script>
</head>
 
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.jsx"></script>
</body>
</html>
